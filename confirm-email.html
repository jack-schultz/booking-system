<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email | EasyTableBook</title>
    <script src="./public/theme-init.js"></script>
    <link rel="stylesheet" href="./landing.css">
</head>
<body class="bg-page text-body font-sans antialiased">

<header class="fixed top-0 inset-x-0 z-50 border-b border-line-subtle/80 bg-page/80 backdrop-blur-md">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-6 py-4" aria-label="Main navigation">
        <a href="index.html" class="text-lg font-semibold tracking-tight text-heading">EasyTableBook</a>

        <div class="flex flex-wrap items-center justify-end gap-x-5 gap-y-2 text-sm">
            <button type="button" data-theme-toggle class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-line text-muted transition-colors hover:border-muted hover:text-heading" aria-label="Switch to light mode">
                <svg class="theme-toggle-icon theme-toggle-icon--sun h-[1.125rem] w-[1.125rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="theme-toggle-icon theme-toggle-icon--moon h-[1.125rem] w-[1.125rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
            </button>
            <a href="login.html" class="text-muted transition-colors hover:text-heading">Log In</a>
            <a href="https://github.com/jack-schultz/booking-system" target="_blank" rel="noopener noreferrer" class="text-muted transition-colors hover:text-heading">GitHub</a>
            <a href="booking/manager" class="rounded-lg bg-accent px-4 py-2 font-medium text-on-accent transition-colors hover:bg-accent-hover">Open Booking App</a>
        </div>
    </nav>
</header>

<main class="flex min-h-screen items-center justify-center px-6 pb-12 pt-28">
    <div class="w-full max-w-md">
        <div class="text-center">
            <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-accent/10 text-accent">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
            </div>
            <h1 class="mt-6 text-3xl font-bold tracking-tight text-heading">Check your email</h1>
            <p class="mt-2 text-muted">
                We sent a confirmation link to
                <strong id="emailDisplay" class="font-medium text-heading"></strong>.
                Click the link to verify your account, then log in.
            </p>
        </div>

        <div class="mt-8 space-y-5 rounded-xl border border-line-subtle bg-page-elevated/50 p-8 text-center">
            <p class="text-sm text-muted">Didn't receive the email? Check your spam folder or resend it.</p>
            <button type="button" id="resendButton" class="w-full rounded-lg bg-accent px-4 py-2.5 font-medium text-on-accent transition-colors hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60">
                Resend confirmation email
            </button>
            <p id="message" class="text-sm"></p>
        </div>

        <p class="mt-6 text-center text-sm text-muted">
            <a href="login.html" class="font-medium text-accent-hover transition-colors hover:text-accent">Back to log in</a>
        </p>
    </div>
</main>

<footer class="border-t border-line-subtle/80 px-6 py-10">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 sm:flex-row">
        <p class="text-sm text-subtle">EasyTableBook &copy; 2026</p>
        <a href="https://github.com/jack-schultz/booking-system" target="_blank" rel="noopener noreferrer" class="text-sm text-muted transition-colors hover:text-heading">
            GitHub
        </a>
    </div>
</footer>

<script type="module" src="./confirm-email.js"></script>
</body>
</html>
