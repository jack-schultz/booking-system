<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | EasyTableBook</title>
    <script src="./public/theme-init.js"></script>
    <link rel="stylesheet" href="./landing.css">
</head>
<body class="bg-page text-body font-sans antialiased">

<header class="fixed top-0 inset-x-0 z-50 border-b border-line-subtle/80 bg-page/80 backdrop-blur-md">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-6 py-4" aria-label="Main navigation">
        <a href="index.html" class="text-lg font-semibold tracking-tight text-heading">EasyTableBook</a>

        <div class="flex flex-wrap items-center justify-end gap-x-5 gap-y-2 text-sm">
            <button type="button" data-theme-toggle class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-line text-muted transition-colors hover:border-muted hover:text-heading" aria-label="Switch to light mode">
                <svg class="theme-toggle-icon theme-toggle-icon--sun h-[1.125rem] w-[1.125rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="theme-toggle-icon theme-toggle-icon--moon h-[1.125rem] w-[1.125rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
            </button>
            <a href="signup.html" class="text-muted transition-colors hover:text-heading">Sign Up</a>
            <a href="https://github.com/jack-schultz/booking-system" target="_blank" rel="noopener noreferrer" class="text-muted transition-colors hover:text-heading">GitHub</a>
            <a href="booking/display-list" class="rounded-lg bg-accent px-4 py-2 font-medium text-on-accent transition-colors hover:bg-accent-hover">Open Booking App</a>
        </div>
    </nav>
</header>

<main class="flex min-h-screen items-center justify-center px-6 pb-12 pt-28">
    <div class="w-full max-w-md">
        <div class="text-center">
            <h1 class="text-3xl font-bold tracking-tight text-heading">Log In</h1>
            <p class="mt-2 text-muted">Welcome back to EasyTableBook</p>
        </div>

        <section id="stored-account-prompt" class="mt-8 rounded-xl border border-line bg-surface p-6 text-center" hidden>
            <p class="text-body">Continue as <strong id="stored-account-name" class="text-heading"></strong>?</p>
            <button type="button" id="stored-account-continue" class="mt-4 rounded-lg bg-accent px-6 py-2.5 font-medium text-on-accent transition-colors hover:bg-accent-hover">
                Continue
            </button>
        </section>

        <form id="loginForm" class="mt-8 space-y-5 rounded-xl border border-line-subtle bg-page-elevated/50 p-8">
            <div>
                <label for="email" class="mb-1.5 block text-sm font-medium text-body">Email</label>
                <input type="email" id="email" placeholder="you@restaurant.com" required autocomplete="email"
                       class="w-full rounded-lg border border-line bg-surface px-4 py-2.5 text-body placeholder:text-subtle focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">
            </div>

            <div>
                <div class="mb-1.5 flex items-center justify-between gap-3">
                    <label for="password" class="text-sm font-medium text-body">Password</label>
                    <a href="forgot-password.html" class="text-sm font-medium text-accent-hover transition-colors hover:text-accent">Forgot password?</a>
                </div>
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password"
                       class="w-full rounded-lg border border-line bg-surface px-4 py-2.5 text-body placeholder:text-subtle focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">
            </div>

            <button type="submit" class="w-full rounded-lg bg-accent px-4 py-2.5 font-medium text-on-accent transition-colors hover:bg-accent-hover">
                Log In
            </button>
        </form>

        <div class="relative mt-6">
            <div class="absolute inset-0 flex items-center" aria-hidden="true">
                <div class="w-full border-t border-line-subtle"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="bg-page px-3 text-subtle">or</span>
            </div>
        </div>

        <p id="error" class="mt-4 text-center text-sm text-error"></p>
        <p class="mt-6 text-center text-sm text-muted">
            Need an account?
            <a href="signup.html" class="font-medium text-accent-hover transition-colors hover:text-accent">Sign up</a>
        </p>
    </div>
</main>

<footer class="border-t border-line-subtle/80 px-6 py-10">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 sm:flex-row">
        <p class="text-sm text-subtle">EasyTableBook &copy; 2026</p>
        <a href="https://github.com/jack-schultz/booking-system" target="_blank" rel="noopener noreferrer" class="text-sm text-muted transition-colors hover:text-heading">
            GitHub
        </a>
    </div>
</footer>

<script type="module" src="./login.js"></script>
</body>
</html>
