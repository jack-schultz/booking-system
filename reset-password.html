<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Password | EasyTableBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-navbar-mount"></div>

<h1>Set New Password</h1>

<form id="resetPasswordForm" class="auth-form" hidden>
    <label for="password">New password</label>
    <input type="password" id="password" autocomplete="new-password" required minlength="6">

    <label for="confirmPassword">Confirm password</label>
    <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="6">

    <button type="submit">Update password</button>
</form>

<p id="message" class="auth-message"></p>
<p><a href="login.html">Back to login</a></p>

<div id="site-footer-mount"></div>

<script type="module" src="./reset-password.js"></script>
</body>
</html>
