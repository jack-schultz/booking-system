<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | EasyTableBook</title>
    <link rel="stylesheet" href="css/auth-pages.css">
</head>
<body>
<div id="site-navbar-mount"></div>

<h1>Reset Password</h1>

<p class="auth-form-intro">Enter your email and we will send you a link to reset your password.</p>

<form id="forgotPasswordForm" class="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="Email" required>

    <button type="submit">Send reset link</button>
</form>

<p id="message" class="auth-message"></p>
<p><a href="login.html">Back to login</a></p>

<div id="site-footer-mount"></div>

<script type="module" src="./forgot-password.js"></script>
</body>
</html>
