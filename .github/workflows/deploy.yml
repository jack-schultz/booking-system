name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure git
        run: git config --global --add safe.directory '*'

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Check repository secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
          VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Repository secrets VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY are missing or empty."
            echo "Add them under Settings → Secrets and variables → Actions → Repository secrets (not Environment secrets)."
            echo "The build will fall back to default values in supabaseClient.js."
          fi
          if [ -z "$VITE_POWERSYNC_URL" ]; then
            echo "::warning::Repository secret VITE_POWERSYNC_URL is missing or empty."
            echo "The deployed app will run in local-only mode without cloud sync."
          fi
          if [ -z "$VITE_DEMO_EMAIL" ] || [ -z "$VITE_DEMO_PASSWORD" ]; then
            echo "::warning::Repository secrets VITE_DEMO_EMAIL and/or VITE_DEMO_PASSWORD are missing or empty."
            echo "Open Demo will not work on deployed sites until both are set."
          fi

      - name: Build main (GitHub Pages)
        working-directory: main
        env:
          VITE_BASE_PATH: /booking-system/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
          VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
        run: |
          npm ci
          npm run build

      - name: Build dev (GitHub Pages)
        working-directory: dev
        env:
          VITE_BASE_PATH: /booking-system/dev/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
          VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
        run: |
          npm ci
          npm run build

      - name: Prepare GitHub Pages site
        run: |
          mkdir public
          cp -r main/dist/* public/
          mkdir -p public/dev
          cp -r dev/dist/* public/dev/

      - name: Build main (Bunny.net)
        working-directory: main
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
          VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
        run: npm run build

      - name: Build dev (Bunny.net)
        working-directory: dev
        env:
          VITE_BASE_PATH: /dev/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.VITE_POWERSYNC_URL }}
          VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
        run: npm run build

      - name: Prepare Bunny.net site
        run: |
          mkdir bunny-public
          cp -r main/dist/* bunny-public/
          mkdir -p bunny-public/dev
          cp -r dev/dist/* bunny-public/dev/

      - name: Upload site artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            public
            bunny-public

  deploy-gh-pages:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download site artifacts
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public

  deploy-bunny:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check Bunny.net repository secrets
        id: bunny-secrets
        env:
          BUNNY_STORAGE_ZONE_NAME: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_STORAGE_ZONE_PASSWORD: ${{ secrets.BUNNY_STORAGE_ZONE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        run: |
          if [ -z "$BUNNY_STORAGE_ZONE_NAME" ] || [ -z "$BUNNY_STORAGE_ZONE_PASSWORD" ] || [ -z "$BUNNY_STORAGE_ENDPOINT" ] || [ -z "$BUNNY_API_KEY" ] || [ -z "$BUNNY_PULL_ZONE_ID" ]; then
            echo "::warning::One or more Bunny.net repository secrets are missing or empty."
            echo "Add BUNNY_STORAGE_ZONE_NAME, BUNNY_STORAGE_ZONE_PASSWORD, BUNNY_STORAGE_ENDPOINT, BUNNY_API_KEY, and BUNNY_PULL_ZONE_ID under Settings → Secrets and variables → Actions → Repository secrets."
            echo "Skipping Bunny.net deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site artifacts
        if: steps.bunny-secrets.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Deploy to Bunny.net
        if: steps.bunny-secrets.outputs.skip != 'true'
        uses: R-J-dev/bunny-deploy@v2.1.1
        with:
          storage-endpoint: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          storage-zone-name: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          storage-zone-password: ${{ secrets.BUNNY_STORAGE_ZONE_PASSWORD }}
          directory-to-upload: bunny-public
          pull-zone-id: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          access-key: ${{ secrets.BUNNY_API_KEY }}
          enable-purge-pull-zone: true
          replication-timeout: "15000"
          concurrency: "20"
